<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <radialGradient id="socBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b1736"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>

    <radialGradient id="socOrb" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="90%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <filter id="socGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#socBg)"/>

  <!-- Centered Glowing Orb -->
  <g transform="translate(640, 210)">
    <circle cx="0" cy="0" r="140" fill="#8b5cf6" opacity="0.16" filter="url(#socGlow)"/>
    <circle cx="0" cy="0" r="90" fill="#38bdf8" opacity="0.18" filter="url(#socGlow)"/>
    
    <ellipse cx="0" cy="0" rx="160" ry="56" fill="none" stroke="#a855f7" stroke-width="1.8" transform="rotate(-20)" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="145" ry="50" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(30)" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="64" fill="url(#socOrb)" filter="url(#socGlow)"/>
    <circle cx="-16" cy="-16" r="26" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Typography -->
  <g transform="translate(640, 390)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="0.12em">REVIA</text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#cbd5e1" letter-spacing="-0.01em">Your computer remembers, so you don't have to.</text>
    <text y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#a855f7" letter-spacing="0.08em">AMBIENT ON-DEVICE MEMORY ENGINE · MACOS &amp; WINDOWS</text>
  </g>

  <!-- Bottom Platform Indicators -->
  <g transform="translate(640, 560)" text-anchor="middle">
    <text font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">
       macOS v1.5.0 (Apple Silicon) &nbsp;·&nbsp; ⊞ Windows x64 Beta &nbsp;·&nbsp; 🔒 100% Local SQLite &amp; ONNX
    </text>
  </g>
</svg>
