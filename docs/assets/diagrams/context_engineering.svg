<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" fill="none">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="900" height="360" rx="16" fill="url(#ce-bg)" stroke="#27272A" stroke-width="1.5" />

  <text x="40" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600">Two-Stage Map-Reduce Context Engineering</text>
  <text x="40" y="66" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Transforming Massive Codebases into Dense Context Without Context Overflow</text>

  <!-- STEP 1: RAW CODE -->
  <g transform="translate(40, 100)">
    <rect width="140" height="200" rx="10" fill="#121215" stroke="#27272A" />
    <text x="14" y="28" fill="#A1A1AA" font-family="sans-serif" font-size="11" font-weight="600">01. RAW CODE</text>
    <rect x="14" y="44" width="112" height="12" rx="3" fill="#27272A" />
    <rect x="14" y="62" width="96" height="8" rx="2" fill="#27272A" />
    <rect x="14" y="76" width="104" height="8" rx="2" fill="#27272A" />
    <rect x="14" y="90" width="80" height="8" rx="2" fill="#27272A" />
    <rect x="14" y="104" width="100" height="8" rx="2" fill="#27272A" />
    <text x="14" y="145" fill="#EF4444" font-family="monospace" font-size="10">Gigabytes / 100k+ Tokens</text>
    <text x="14" y="165" fill="#71717A" font-family="sans-serif" font-size="9">Too big for single LLM prompt</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M190 200 L230 200" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2: STAGE 1 MAP -->
  <g transform="translate(240, 100)">
    <rect width="180" height="200" rx="10" fill="#121215" stroke="#10B981" stroke-width="1.5" />
    <text x="14" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">02. STAGE 1 : MAP</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="500">Parallel Groq Batching</text>
    <text x="14" y="70" fill="#D4D4D8" font-family="sans-serif" font-size="10">• Line-bounded chunking</text>
    <text x="14" y="88" fill="#D4D4D8" font-family="sans-serif" font-size="10">• Semantic lockfile parser</text>
    <text x="14" y="106" fill="#D4D4D8" font-family="sans-serif" font-size="10">• AST notebook extraction</text>
    <text x="14" y="130" fill="#34D399" font-family="monospace" font-size="10">Dense 3-4 sentence behavioral summary per file</text>
  </g>

  <!-- ARROW 2 -->
  <path d="M430 200 L470 200" stroke="#10B981" stroke-width="2" />

  <!-- STEP 3: KNOWLEDGE CACHE -->
  <g transform="translate(480, 100)">
    <rect width="160" height="200" rx="10" fill="#121215" stroke="#27272A" />
    <text x="14" y="28" fill="#A1A1AA" font-family="sans-serif" font-size="11" font-weight="600">03. CACHE</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="500">.doclify/cache.json</text>
    <text x="14" y="75" fill="#71717A" font-family="sans-serif" font-size="10">Stores compact JSON summaries on disk.</text>
    <rect x="14" y="100" width="132" height="40" rx="6" fill="#18181B" stroke="#27272A" />
    <text x="22" y="118" fill="#10B981" font-family="monospace" font-size="10">O(1) Incremental</text>
    <text x="22" y="130" fill="#71717A" font-family="sans-serif" font-size="9">File Updates</text>
  </g>

  <!-- ARROW 3 -->
  <path d="M650 200 L690 200" stroke="#10B981" stroke-width="2" />

  <!-- STEP 4: STAGE 2 REDUCE -->
  <g transform="translate(700, 100)">
    <rect width="160" height="200" rx="10" fill="#121215" stroke="#10B981" stroke-width="1.5" />
    <text x="14" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">04. STAGE 2 : REDUCE</text>
    <text x="14" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="500">README Synthesis</text>
    <text x="14" y="75" fill="#D4D4D8" font-family="sans-serif" font-size="10">Aggregates cache with Principal Architect prompt to output:</text>
    <text x="14" y="125" fill="#34D399" font-family="monospace" font-size="10">✔ README.md</text>
    <text x="14" y="145" fill="#34D399" font-family="monospace" font-size="10">✔ Artifact History</text>
  </g>
</svg>
