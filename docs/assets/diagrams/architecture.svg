<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bg-grad)" stroke="#27272A" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="48" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600">Doclify System Architecture</text>
  <text x="40" y="70" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Decoupled Dual-Interface • 2-Stage Context Compaction Engine • Groq LPU Inference</text>

  <!-- LAYER 1: CLIENTS -->
  <g transform="translate(40, 110)">
    <rect width="200" height="320" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="20" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">LAYER 01 : CLIENTS</text>
    
    <!-- React SPA -->
    <g transform="translate(16, 50)">
      <rect width="168" height="70" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="14" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Vite + React SPA</text>
      <text x="14" y="48" fill="#71717A" font-family="sans-serif" font-size="11">Verdant UI • SSE Stream</text>
    </g>

    <!-- Click CLI -->
    <g transform="translate(16, 135)">
      <rect width="168" height="70" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="14" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Click CLI Engine</text>
      <text x="14" y="48" fill="#71717A" font-family="sans-serif" font-size="11">doclify init / run / update</text>
    </g>

    <!-- Project Ingestion Sources -->
    <g transform="translate(16, 220)">
      <rect width="168" height="80" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="14" y="24" fill="#A1A1AA" font-family="sans-serif" font-size="11" font-weight="600">Project Inputs</text>
      <text x="14" y="42" fill="#71717A" font-family="sans-serif" font-size="10">• Local Directories</text>
      <text x="14" y="56" fill="#71717A" font-family="sans-serif" font-size="10">• Sandboxed ZIPs</text>
      <text x="14" y="70" fill="#71717A" font-family="sans-serif" font-size="10">• Shallow GitHub Clones</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -->
  <path d="M240 200 L290 200" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />

  <!-- LAYER 2: API & PIPELINE -->
  <g transform="translate(290, 110)">
    <rect width="360" height="320" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="20" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">LAYER 02 : FASTAPI & CONTEXT PIPELINE</text>
    
    <!-- FastAPI Core -->
    <g transform="translate(16, 50)">
      <rect width="328" height="50" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="16" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">FastAPI REST & Server-Sent Events (SSE)</text>
      <text x="16" y="40" fill="#71717A" font-family="sans-serif" font-size="10">Path Traversal Sandboxing • Project Manager • Static Host</text>
    </g>

    <!-- Context Pipeline Steps -->
    <g transform="translate(16, 115)">
      <rect width="328" height="185" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="16" y="24" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">Agentic Context Compaction Engine</text>
      
      <!-- Stage 0 -->
      <text x="16" y="48" fill="#D4D4D8" font-family="sans-serif" font-size="11">1. Scanner (.gitignore & PathSpec filtering)</text>
      <!-- Stage 1 Prep -->
      <text x="16" y="70" fill="#D4D4D8" font-family="sans-serif" font-size="11">2. Lockfile & AST Extractor (Token Budgeting)</text>
      <!-- Stage 1 Map -->
      <text x="16" y="92" fill="#D4D4D8" font-family="sans-serif" font-size="11">3. Stage 1 Batch Summarizer (Map Phase)</text>
      <!-- Cache -->
      <text x="16" y="114" fill="#D4D4D8" font-family="sans-serif" font-size="11">4. Knowledge Cache (.doclify/cache.json)</text>
      <!-- Stage 2 Reduce -->
      <text x="16" y="136" fill="#D4D4D8" font-family="sans-serif" font-size="11">5. Stage 2 README Synthesizer (Reduce Phase)</text>
      <!-- Output -->
      <text x="16" y="158" fill="#D4D4D8" font-family="sans-serif" font-size="11">6. Artifact Versioning (.doclify/generated_artifacts/)</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -->
  <path d="M650 240 L700 240" stroke="#10B981" stroke-width="2" />

  <!-- LAYER 3: LLM INFERENCE -->
  <g transform="translate(700, 110)">
    <rect width="260" height="320" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="20" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">LAYER 03 : INFERENCE</text>
    
    <!-- Groq LPU -->
    <g transform="translate(16, 50)">
      <rect width="228" height="110" rx="8" fill="#09090B" stroke="#10B981" stroke-width="1.5" />
      <text x="16" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="600">Groq LPU Network</text>
      <text x="16" y="48" fill="#10B981" font-family="monospace" font-size="11">Ultra-Low Latency</text>
      <text x="16" y="70" fill="#71717A" font-family="sans-serif" font-size="10">• llama-3.3-70b-versatile</text>
      <text x="16" y="85" fill="#71717A" font-family="sans-serif" font-size="10">• llama-3.1-8b-instant</text>
      <text x="16" y="100" fill="#71717A" font-family="sans-serif" font-size="10">• qwen/qwen3.6-27b</text>
    </g>

    <!-- Token Safety Shield -->
    <g transform="translate(16, 175)">
      <rect width="228" height="125" rx="8" fill="#09090B" stroke="#27272A" />
      <text x="16" y="24" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">Adaptive Safety Shield</text>
      <text x="16" y="44" fill="#71717A" font-family="sans-serif" font-size="10">• 12,000 char chunk ceiling</text>
      <text x="16" y="60" fill="#71717A" font-family="sans-serif" font-size="10">• 413 context reduction retry</text>
      <text x="16" y="76" fill="#71717A" font-family="sans-serif" font-size="10">• 429 burst rate backoff</text>
      <text x="16" y="92" fill="#71717A" font-family="sans-serif" font-size="10">• TPD daily quota preservation</text>
      <text x="16" y="108" fill="#71717A" font-family="sans-serif" font-size="10">• Zero-loss cache fallback</text>
    </g>
  </g>
</svg>
