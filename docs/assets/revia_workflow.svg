<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .step-num { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 800; fill: #a855f7; letter-spacing: 0.1em; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.4; }
  </style>

  <rect width="1000" height="240" rx="14" fill="#0c0e14" stroke="#222838" stroke-width="1.2"/>

  <!-- STEP 1 -->
  <g transform="translate(30, 30)">
    <rect width="205" height="180" rx="12" fill="url(#stepGrad)" stroke="#2b3347" stroke-width="1"/>
    <text x="20" y="32" class="step-num">STEP 01</text>
    <text x="20" y="62" class="step-title">Silent Ingestion</text>
    <text x="20" y="92" class="step-desc">
      <tspan x="20" dy="0">Chrome history &amp; memory</tspan>
      <tspan x="20" dy="18">are parsed in the background</tspan>
      <tspan x="20" dy="18">without impacting performance.</tspan>
    </text>
    <circle cx="175" cy="30" r="12" fill="#1e1b4b"/>
    <text x="175" y="34" text-anchor="middle" font-size="12" fill="#c084fc">📥</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M 245 120 L 265 120" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- STEP 2 -->
  <g transform="translate(275, 30)">
    <rect width="205" height="180" rx="12" fill="url(#stepGrad)" stroke="#2b3347" stroke-width="1"/>
    <text x="20" y="32" class="step-num">STEP 02</text>
    <text x="20" y="62" class="step-title">Local Indexing</text>
    <text x="20" y="92" class="step-desc">
      <tspan x="20" dy="0">Full-text BM25 tables &amp;</tspan>
      <tspan x="20" dy="18">384-dim vector embeddings</tspan>
      <tspan x="20" dy="18">stored in local SQLite.</tspan>
    </text>
    <circle cx="175" cy="30" r="12" fill="#1e1b4b"/>
    <text x="175" y="34" text-anchor="middle" font-size="12" fill="#c084fc">⚡</text>
  </g>

  <!-- ARROW 2 -->
  <path d="M 490 120 L 510 120" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- STEP 3 -->
  <g transform="translate(520, 30)">
    <rect width="205" height="180" rx="12" fill="url(#stepGrad)" stroke="#2b3347" stroke-width="1"/>
    <text x="20" y="32" class="step-num">STEP 03</text>
    <text x="20" y="62" class="step-title">Instant Summon</text>
    <text x="20" y="92" class="step-desc">
      <tspan x="20" dy="0">Double-tap ⌃⌃ or Alt+Space</tspan>
      <tspan x="20" dy="18">to invoke the translucent</tspan>
      <tspan x="20" dy="18">search capsule in &lt;100ms.</tspan>
    </text>
    <circle cx="175" cy="30" r="12" fill="#1e1b4b"/>
    <text x="175" y="34" text-anchor="middle" font-size="12" fill="#c084fc">✨</text>
  </g>

  <!-- ARROW 3 -->
  <path d="M 735 120 L 755 120" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- STEP 4 -->
  <g transform="translate(765, 30)">
    <rect width="205" height="180" rx="12" fill="url(#stepGrad)" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="20" y="32" class="step-num">STEP 04</text>
    <text x="20" y="62" class="step-title">Recall &amp; Launch</text>
    <text x="20" y="92" class="step-desc">
      <tspan x="20" dy="0">Hybrid reranker delivers</tspan>
      <tspan x="20" dy="18">exact matches instantly.</tspan>
      <tspan x="20" dy="18">Press Enter to open.</tspan>
    </text>
    <circle cx="175" cy="30" r="12" fill="#2e1065"/>
    <text x="175" y="34" text-anchor="middle" font-size="12" fill="#a855f7">🎯</text>
  </g>
</svg>
