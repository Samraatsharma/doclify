<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="20" fill="#09090B" />
  <rect width="800" height="240" rx="20" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Subtle Emerald Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#grad-glow)" filter="url(#blur-glow)" />

  <!-- Logo Mark -->
  <g transform="translate(60, 60)">
    <!-- Hexagon Frame -->
    <polygon points="60,0 112,30 112,90 60,120 8,90 8,30" fill="#18181B" stroke="#27272A" stroke-width="2" />
    <polygon points="60,10 102,34 102,86 60,110 18,86 18,34" fill="#09090B" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Code Bracket / Spark Geometric -->
    <path d="M44 42 L28 60 L44 78" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M76 42 L92 60 L76 78" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="60" r="6" fill="url(#grad-emerald)" />
    <line x1="60" y1="36" x2="60" y2="46" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="74" x2="60" y2="84" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="210" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="54" font-weight="700" letter-spacing="-2px">DOCLIFY</text>
  <text x="212" y="152" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="3px">AGENTIC CODEBASE INTELLIGENCE</text>

  <!-- Tagline Pill -->
  <g transform="translate(210, 168)">
    <rect width="320" height="26" rx="13" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500">Your Codebase. Understood.</text>
  </g>
</svg>
