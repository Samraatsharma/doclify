<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background Tile -->
  <rect width="64" height="64" rx="16" fill="#07090e" />
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none" />

  <!-- Outer Gyroscopic Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="10" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-25 32 32)" filter="url(#glowFilter)"/>
  
  <!-- Counter-Orbiting Inner Ring -->
  <ellipse cx="32" cy="32" rx="18" ry="7" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" transform="rotate(38 32 32)"/>

  <!-- Glowing Luminous Memory Core -->
  <circle cx="32" cy="32" r="11" fill="url(#coreGlow)" filter="url(#glowFilter)" />
  
  <!-- Specular Reflection Highlight -->
  <ellipse cx="28.5" cy="27.5" rx="3.5" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-30 28.5 27.5)"/>
</svg>